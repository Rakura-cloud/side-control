# Let the Side Control backend own the HID PSMs (17/19): disable bluetoothd's HID host plugin.
# Side effect: classic Bluetooth mice/keyboards can't connect TO this PC while this is in place (LE ones
# use the hog plugin and still work). Without it Side Control still works, but only connects to devices
# itself (they cannot connect to it).
[Service]
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd -P input
