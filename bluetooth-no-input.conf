# Let side_control_backend.py own the HID PSMs (17/19): disable bluetoothd's HID host plugin.
# Side effect: Bluetooth mice/keyboards can't connect TO this PC while this is in place. Without it
# Side Control still works, but only connects to devices itself (they cannot connect to it).
[Service]
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd -P input
